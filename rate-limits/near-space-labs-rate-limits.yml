description: >-
  Near Space Labs enforces a rate limit but does not publish it. The docs name 429 as the exhaustion
  status and tell clients to "back off and retry after a delay", and the page titled "Rate Limits &
  Performance" contains no limit at all — it discusses token TTL and median latency instead. No
  numeric quota, no window, no burst allowance and no rate-limit response header is documented, so an
  agent cannot budget its request rate and can only discover the ceiling by hitting it.
