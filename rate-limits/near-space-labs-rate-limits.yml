provider_performance_guidance:
  - For bulk downloads, use the coverage endpoint to precompute the tile list, then parallelize fetches.
  - Use connection pooling (requests.Session() in Python) for repeated requests.
  - Batch coverage queries by AOI to find the minimal set of tiles before downloading.
gap: >-
  The provider explicitly tells consumers to parallelize bulk tile fetches while publishing no
  concurrency ceiling and no runtime rate-limit signal. That combination is the finding: a client
  following the documented bulk-download pattern has no way to stay inside a limit it cannot see.
