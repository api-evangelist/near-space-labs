apis:
- name: Near Space Labs Tile Service
  description: >-
    A standards-based XYZ tile service for Near Space Labs stratospheric aerial imagery. Serves both the
    latest and historical mosaics as 256x256 PNG/JPEG tiles between zoom 14 and 21, plus a paginated survey
    catalog, per-survey GeoJSON footprints, WKT area-of-interest coverage queries that return tile footprints
    with static tile URLs, and a mosaic_updates feed for change detection. The v2 path family carries ISO 8601
    timestamps; the un-versioned /tile/ family is legacy and emits deprecation warnings.
  humanURL: https://docs.nearspacelabs.com/api/tile-server
  baseURL: https://api.nearspacelabs.net
  tags:
  - Aerial Imagery
  - Tiles
  - Geospatial
  - Earth Observation
  properties:
  - type: OpenAPI
    url: openapi/near-space-labs-tile-service.json
  - type: Overlay
    url: overlays/near-space-labs-tile-service-overlay.yaml
  - type: Documentation
