aid: near-space-labs
name: Near Space Labs
description: >-
  Near Space Labs is a New York based Earth-observation company that operates a fleet of autonomous,
  wind-navigated stratospheric vehicles ("Swifty") flying at roughly 65,000 feet to capture 7cm-resolution
  orthoimagery across approximately 80% of the United States, refreshed twice a year. Imagery is delivered
  programmatically through a public developer surface at docs.nearspacelabs.com: an OAuth 2.0 client-credentials
  token service and a standards-based XYZ Tile Service on api.nearspacelabs.net that streams PNG/JPEG tiles at
  zoom 14-21, exposes paginated survey catalogs, GeoJSON footprints, WKT-based coverage queries and mosaic-update
  feeds. Both services publish machine-readable Swagger 2.0 contracts and share a single Postman collection.
  Customers use the imagery for P&C insurance underwriting and claims, state and local government GIS, utility
  and infrastructure monitoring, forestry and wildfire risk, mapping basemaps, and roofing and home services.
