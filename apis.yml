- name: Near Space Labs OAuth Service
  description: >-
    The authentication service for every Near Space Labs API. Exchanges an NSL client id and client secret for
    a 60-minute Bearer JWT via OAuth 2.0 client credentials at POST /oauth/token, and issues long-lived
    one-year static API keys via POST /oauth/static_key for embedding tiles in web maps where token refresh
    is impractical. Tokens are presented as an Authorization Bearer header; static keys travel as an api_key
    query parameter.
  humanURL: https://docs.nearspacelabs.com/api/oauth
  baseURL: https://api.nearspacelabs.net
  tags:
  - Authentication
  - OAuth
  - Security
  properties:
  - type: OpenAPI
    url: openapi/near-space-labs-oauth-service.json
  - type: Overlay
    url: overlays/near-space-labs-oauth-service-overlay.yaml
  - type: Documentation
