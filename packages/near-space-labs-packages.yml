current_rest_api_client_story: >-
  For the documented Tile Service and OAuth Service there is no SDK at all. The provider ships a
  public Postman collection (postman/near-space-labs-postman-collection.json, also served at
  https://docs.nearspacelabs.com/nsl_postman.json) and copy-paste Python/JavaScript/Bash examples
  on every docs page. That collection is the closest thing to a maintained client artifact.
