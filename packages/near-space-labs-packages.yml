description: >-
  Near Space Labs ships exactly one first-party client library, and it is stale. `nsl.stac` is a
  Python gRPC client for the company's SpatioTemporal Asset Catalog (STAC) metadata service and
  GeoTIFF/thumbnail download surface. Its last release is 1.2.7 from 2023-09-07, its declared
  Homepage (github.com/nearspacelabs/stac-client-python) now returns 404 — the repository has been
  removed from the public GitHub org, which today contains only seven forks of third-party
  geospatial projects — and the gRPC host family it wrapped no longer resolves in DNS. The current
  documented product is the REST Tile Service on api.nearspacelabs.net, and NO first-party SDK
  exists for it in any registry: the docs teach it with raw `requests` / `fetch` / `curl` snippets
  and a Postman collection instead.
