source: >-
  Derived from openapi/near-space-labs-tile-service.json and
  openapi/near-space-labs-oauth-service.json. Searched first for a published server:
  https://docs.nearspacelabs.com/ (10 pages, no MCP page), https://www.nearspacelabs.com/llms.txt (no
